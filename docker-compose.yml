services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: contrata
      POSTGRES_USER: contrata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contrata"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-ContrataAPI}
      DATABASE_URL: postgresql+psycopg://contrata:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/contrata
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Sincroniza com o PNCP a cada hora.
  sync:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://contrata:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/contrata
    command: sh -c "while true; do python cli.py sync; sleep 3600; done"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
